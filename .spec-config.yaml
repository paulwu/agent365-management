imports:
  - grounding-rules
  - research-conventions
  - wizard-agent
  - research-agent
  - doc-architecture
  - readme-structure

variables:
  # --- grounding-rules ---
  PRIMARY_SOURCE_URL: "https://learn.microsoft.com/en-us/entra/agent-id/"
  PRIMARY_SOURCE_NAME: "Microsoft Learn"
  CACHED_BASELINE_FILE: "research/Microsoft-Learn-Entra-AgentID.md"
  SECONDARY_NOTE_FILES: "ChatGPT.md, Gemini.md, Researcher.md, Microsoft-Learn.md"
  RESEARCH_FOLDER: "research"
  DOCS_FOLDER: "docs"

  # --- research-conventions ---
  RESEARCH_CURATOR_NAME: "Research Curator"

  # --- research-agent ---
  RESEARCH_AGENT_NAME: "Entra Researcher"
  RESEARCH_AGENT_DESCRIPTION: "Research agent grounded on official Microsoft Learn Entra Agent ID documentation. Use @Entra-Researcher for authoritative answers about agent identities, blueprints, registry, governance, and security."
  RESPONSE_CAPTURE_FOLDER: "copilot-playground"
  RESPONSE_TIMEZONE: "America/Los_Angeles"
  SCRIPTS_FOLDER: "scripts"

  # --- doc-architecture ---
  RAW_RESEARCH_FOLDER: "research"
  SYNTHESIZED_DOCS_FOLDER: "docs"
  AUTOMATION_FOLDER: "scripts"

  # --- readme-structure ---
  COPILOT_PRIMER_PATH: "docs/github-copilot-primer/README.md"

  # --- project-level ---
  PROJECT_NAME: "Agent 365 Management"
  PROJECT_DESCRIPTION: "Knowledge base for managing and governing AI agents in Microsoft 365 using Microsoft Agent 365, Microsoft Entra Agent ID, and the Agent Registry"

overrides:
  # --- grounding-rules ---
  # copilot-instructions.md "Canonical sources" section uses project-specific
  # wording: "live Microsoft Learn content" qualifier, "or to find the right
  # page URL first" clause, backtick-wrapped filenames, docs/ exception clause,
  # intro paragraph, and Entra-Researcher cross-reference line.
  - spec: grounding-rules
    file: .github/copilot-instructions.md
    section: "Canonical sources and grounding"
    reason: "Project-specific wording enhancements that preserve spec intent"

  # --- doc-architecture ---
  # copilot-instructions.md "Repository architecture" section adds "that matter
  # together", uses a more specific scripts/ description, and includes the
  # cross-file workflow, build commands, conventions, and key-files sections.
  - spec: doc-architecture
    file: .github/copilot-instructions.md
    section: "Repository architecture"
    reason: "Project-specific detail beyond the spec template"
