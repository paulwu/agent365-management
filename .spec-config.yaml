spec_repo: paulwu/curated-advisor-specs
spec_version: "2.0.0"
imported_at: "2026-03-28T00:09:33-07:00"

imports:
  # --- Tier 1: Core Specs ---
  - id: grounding-rules
    drift_mode: behavioral
  - id: research-conventions
    drift_mode: structural
  - id: doc-architecture
    drift_mode: behavioral
  - id: readme-structure
    drift_mode: structural
  - id: response-capture
    drift_mode: structural

  # --- Tier 2: Role Specs ---
  - id: research-agent
    drift_mode: structural
  - id: author-agent
    drift_mode: structural
  - id: wizard-agent
    drift_mode: structural

variables:
  # --- grounding-rules ---
  PRIMARY_SOURCE_URL: "https://learn.microsoft.com/en-us/entra/agent-id/"
  PRIMARY_SOURCE_NAME: "Microsoft Learn"
  CACHED_BASELINE_FILE: "grounding/Microsoft-Learn-Entra-AgentID.md"
  SECONDARY_NOTE_FILES: "ChatGPT.md, Gemini.md, Researcher.md, Microsoft-Learn.md"
  KNOWLEDGE_FOLDER: "grounding"
  DOCS_FOLDER: "docs"

  # --- research-conventions ---
  CURATOR_AGENT_NAME: "Entra Curator"

  # --- response-capture ---
  RESPONSE_FOLDER: "answers"
  RESPONSE_TIMEZONE: "America/Los_Angeles"
  RESPONSE_FILENAME_PREFIX: "response"

  # --- research-agent ---
  RESEARCH_AGENT_NAME: "Entra Researcher"
  RESEARCH_AGENT_DESCRIPTION: "Research agent grounded on official Microsoft Learn Entra Agent ID documentation. Use @Entra-Researcher for authoritative answers about agent identities, blueprints, registry, governance, and security."
  SCRIPTS_FOLDER: "scripts"

  # --- author-agent ---
  AUTHOR_AGENT_NAME: "Entra Curator"
  AUTHOR_AGENT_DESCRIPTION: "Agent for creating and maintaining grounding notes in the grounding/ folder. Ensures all notes have proper Author and Priority headers."
  CONTENT_TEMPLATE_PATH: ""

  # --- doc-architecture ---
  SYNTHESIZED_DOCS_FOLDER: "docs"
  AUTOMATION_FOLDER: "scripts"

  # --- readme-structure ---
  COPILOT_PRIMER_PATH: "docs/github-copilot-primer/README.md"

  # --- project-level ---
  PROJECT_NAME: "Agent 365 Management"
  PROJECT_DESCRIPTION: "Knowledge base for managing and governing AI agents in Microsoft 365 using Microsoft Agent 365, Microsoft Entra Agent ID, and the Agent Registry"

overrides:
  # With drift_mode: behavioral, the grounding-rules and doc-architecture
  # overrides from v1.1.0 are no longer needed — behavioral checks allow
  # project-specific wording by design. Only truly intentional deviations
  # from required elements need to be listed here.
  []
